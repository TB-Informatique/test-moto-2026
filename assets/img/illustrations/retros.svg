  <text x="22" y="28" fill="#f8fafc" font-size="16" font-family="system-ui,sans-serif" font-weight="700">R&#233;gler les r&#233;troviseurs</text>
  <text x="22" y="48" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Assis en position de conduite, bras d&#233;tendus, sans se pencher vers le miroir</text>
