  <path d="M50 200 C90 200 100 150 140 150 S180 200 220 200 S260 150 300 150 S340 200 380 200" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <path d="M380 200 C420 200 460 80 520 80" fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/>
  <path d="M520 80 C560 80 560 160 600 200 S640 230 670 200" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
