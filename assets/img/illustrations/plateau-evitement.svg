  <text x="22" y="48" fill="#cbd5e1" font-size="12" font-family="system-ui,sans-serif">Deux temps : d&#8217;abord le slalom, ensuite seulement l&#8217;&#233;vitement. Un c&#244;ne d&#8217;&#233;vitement = C.</text>
